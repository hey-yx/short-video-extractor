services:
  app:
    build:
      context: .
    image: short-video-extractor:v2
    container_name: short-video-extractor
    ports:
      - "7777:7777"
    restart: unless-stopped
    mem_limit: 800m
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
