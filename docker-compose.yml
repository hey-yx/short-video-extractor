services:
  sve:
    build:
      context: .
    image: video-parser:v2
    container_name: video-parser-v2
    ports:
      - "16004:7777"
    restart: unless-stopped
    mem_limit: 800m
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
