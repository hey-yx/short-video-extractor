<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>服务状态 · 短视频解析</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1c1f23;
        --muted: #6b7280;
        --border: #d8dce3;
        --accent: #2563eb;
        --accent-text: #ffffff;
        --error-bg: #fdecea;
        --error-border: #e5b3ad;
        --error-text: #8a2f25;
        --ok-bg: #e8f3ec;
        --ok-border: #a9cdb6;
        --ok-text: #20582f;
        --warn-bg: #fdf5e4;
        --warn-border: #e4cb96;
        --warn-text: #7a5414;
        --ok-dot: #1a9e55;
        --warn-dot: #d97706;
        --err-dot: #dc2626;
        --idle-dot: #9aa1ad;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181c;
          --card: #1f2228;
          --text: #e7e9ee;
          --muted: #9aa1ad;
          --border: #363b44;
          --accent: #5b8def;
          --accent-text: #ffffff;
          --error-bg: #3a221f;
          --error-border: #6e3b34;
          --error-text: #f0b3ab;
          --ok-bg: #1e2f23;
          --ok-border: #34543c;
          --ok-text: #a6d5b2;
          --warn-bg: #33290f;
          --warn-border: #5c4a1e;
          --warn-text: #ecd39a;
          --ok-dot: #34d27b;
          --warn-dot: #f5a623;
          --err-dot: #f25555;
          --idle-dot: #6b7280;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px 48px;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 1.02rem;
        margin: 0 0 12px;
      }
      p.lead {
        color: var(--muted);
        margin: 0 0 20px;
      }
      section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 4px;
      }
      input[type='text'] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        font-size: 0.95rem;
      }
      input[type='text']:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .row input {
        flex: 1;
      }
      button {
        padding: 8px 18px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 0.95rem;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--accent);
      }
      .field {
        margin-bottom: 12px;
      }
      .hint {
        font-size: 0.82rem;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        padding: 1px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .badge.ok {
        border-color: var(--ok-border);
        background: var(--ok-bg);
        color: var(--ok-text);
      }
      .badge.err {
        border-color: var(--error-border);
        background: var(--error-bg);
        color: var(--error-text);
      }
      .badge.warn {
        border-color: var(--warn-border);
        background: var(--warn-bg);
        color: var(--warn-text);
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      .title {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 4px 0;
      }
      .desc {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 0 12px;
      }
      .cover {
        width: 100%;
        max-height: 320px;
        object-fit: contain;
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .grid img {
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      ul.links {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      ul.links li {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 0;
        border-top: 1px solid var(--border);
      }
      ul.links li:first-child {
        border-top: none;
      }
      ul.links a {
        flex: 1;
        min-width: 0;
        color: var(--accent);
        word-break: break-all;
        font-size: 0.85rem;
        text-decoration: none;
      }
      ul.links a:hover {
        text-decoration: underline;
      }
      .kind {
        font-size: 0.82rem;
        color: var(--muted);
        width: 100%;
      }
      .notice {
        border: 1px solid var(--error-border);
        background: var(--error-bg);
        color: var(--error-text);
        border-radius: 8px;
        padding: 12px 14px;
      }
      .notice .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.82rem;
      }
      .notice .next {
        margin-top: 6px;
      }
      .ci-line {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .ci-line img {
        height: 20px;
      }
      footer {
        color: var(--muted);
        font-size: 0.82rem;
        text-align: center;
      }

      /* ===== 状态总览横幅 ===== */
      .banner {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 16px;
        align-items: center;
        justify-content: space-between;
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 22px 20px;
        margin-bottom: 16px;
      }
      .banner.ok {
        background: var(--ok-bg);
        border-color: var(--ok-border);
        color: var(--ok-text);
      }
      .banner.warn {
        background: var(--warn-bg);
        border-color: var(--warn-border);
        color: var(--warn-text);
      }
      .banner.err {
        background: var(--error-bg);
        border-color: var(--error-border);
        color: var(--error-text);
      }
      .banner.idle {
        background: var(--card);
      }
      .banner-main {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }
      .banner .dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        flex: none;
        background: var(--idle-dot);
      }
      .banner.ok .dot {
        background: var(--ok-dot);
        animation: pulse 2s ease-out infinite;
      }
      .banner.warn .dot {
        background: var(--warn-dot);
      }
      .banner.err .dot {
        background: var(--err-dot);
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok-dot) 45%, transparent);
        }
        70% {
          box-shadow: 0 0 0 12px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      .banner-text {
        min-width: 0;
      }
      .banner-text .headline {
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 1.3;
      }
      .banner-text .subline {
        font-size: 0.85rem;
        opacity: 0.85;
        margin-top: 2px;
      }
      .banner-side {
        text-align: right;
        font-size: 0.8rem;
        opacity: 0.85;
      }
      .banner-side .ctl {
        margin-top: 6px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
      }
      .banner-side .ctl input {
        accent-color: var(--accent);
      }

      /* ===== 计数卡 ===== */
      .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      @media (max-width: 640px) {
        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .stat {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        background: var(--bg);
      }
      .stat .num {
        font-size: 1.45rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.25;
      }
      .stat .lbl {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .stat.alert .num {
        color: var(--err-dot);
      }

      /* ===== 平台卡 ===== */
      .platforms {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      @media (max-width: 640px) {
        .platforms {
          grid-template-columns: 1fr;
        }
      }
      .platform {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        background: var(--bg);
      }
      .platform .name {
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .platform .name .pdot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--idle-dot);
        flex: none;
      }
      .platform.ready .name .pdot {
        background: var(--ok-dot);
      }
      .platform .pdesc {
        font-size: 0.84rem;
        color: var(--muted);
        margin: 2px 0 6px;
      }
      .platform .pbadges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      /* ===== 事件列表 ===== */
      ul.events {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      ul.events li {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 7px 0;
        border-top: 1px solid var(--border);
        font-size: 0.9rem;
      }
      ul.events li:first-child {
        border-top: none;
      }
      ul.events .cnt {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        flex: none;
      }
      ul.events .when {
        margin-left: auto;
        color: var(--muted);
        font-size: 0.8rem;
        flex: none;
      }
      .stale {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 10px;
      }
      .section-err {
        border: 1px solid var(--error-border);
        background: var(--error-bg);
        color: var(--error-text);
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.88rem;
      }
      .kv {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 22px;
        font-size: 0.9rem;
        margin-bottom: 14px;
      }
      .kv b {
        font-variant-numeric: tabular-nums;
      }
      .kv .k {
        color: var(--muted);
      }
      code.cmd {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.82rem;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 6px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>服务状态</h1>
      <p class="lead">这里能看到解析服务是否在正常运行、最近处理了多少请求。粘贴分享链接可以当场试一次解析。</p>

      <!-- 状态总览 -->
      <div id="banner" class="banner idle">
        <div class="banner-main">
          <span class="dot" aria-hidden="true"></span>
          <div class="banner-text">
            <div class="headline" id="banner-headline">正在检查服务…</div>
            <div class="subline" id="banner-subline">第一次检查通常几秒内完成。</div>
          </div>
        </div>
        <div class="banner-side">
          <div id="banner-checked">尚未检查</div>
          <label class="ctl"><input id="auto" type="checkbox" checked />每 10 秒自动刷新</label>
        </div>
      </div>

      <!-- 服务地址 -->
      <section>
        <h2>服务地址</h2>
        <div class="field">
          <label for="base">这台页面从哪里读状态。两种打开方式都能用：</label>
          <div class="row">
            <input id="base" type="text" spellcheck="false" />
            <button id="recheck" class="secondary">重新检查</button>
          </div>
          <p class="hint" id="base-hint"></p>
        </div>
      </section>

      <!-- 服务状态 -->
      <section>
        <h2>服务</h2>
        <div id="svc-body"><p class="hint">等待检查结果…</p></div>
      </section>

      <!-- 使用情况 -->
      <section>
        <h2>使用情况</h2>
        <div id="usage-body"><p class="hint">等待检查结果…</p></div>
      </section>

      <!-- 解析演示 -->
      <section>
        <h2>解析演示</h2>
        <div class="field">
          <label for="share">粘贴一条分享链接或分享口令（抖音 / 快手 / B 站 / 小红书）</label>
          <div class="row">
            <input
              id="share"
              type="text"
              placeholder="例如 https://www.bilibili.com/video/BV1GJ411x7h7"
              spellcheck="false"
            />
            <button id="go">解析</button>
          </div>
          <p class="hint">口令里夹的文字不用管，会自动挑出链接。</p>
        </div>
        <div id="result"></div>
      </section>

      <!-- CI 状态 -->
      <section>
        <h2>构建检查</h2>
        <div class="ci-line">
          <img
            src="https://github.com/hey-yx/short-video-extractor/actions/workflows/test.yml/badge.svg"
            alt="GitHub Actions 状态徽章"
          />
          <span id="ci-text" class="hint">正在读取最近一次检查结果……</span>
        </div>
      </section>

      <footer>short-video-extractor · 页面上的数据来自你填的服务地址，本页不保存任何链接内容</footer>
    </main>

    <script>
      (function () {
        var BASE_KEY = 'sve-parse-base';
        var AUTO_KEY = 'sve-auto-refresh';
        var DEFAULT_BASE = 'http://127.0.0.1:7777';
        var REFRESH_MS = 10000;

        var baseInput = document.getElementById('base');
        var baseHint = document.getElementById('base-hint');
        var shareInput = document.getElementById('share');
        var resultDiv = document.getElementById('result');
        var banner = document.getElementById('banner');
        var bannerHeadline = document.getElementById('banner-headline');
        var bannerSubline = document.getElementById('banner-subline');
        var bannerChecked = document.getElementById('banner-checked');
        var autoBox = document.getElementById('auto');
        var svcBody = document.getElementById('svc-body');
        var usageBody = document.getElementById('usage-body');
        var ciText = document.getElementById('ci-text');

        // file:// 打开 = 本机模式（要手填服务地址）；http(s) 打开 = 部署态，默认查本页同一地址
        var sameOrigin = location.protocol !== 'file:';
        var modeBase = sameOrigin ? location.origin : localStorage.getItem(BASE_KEY) || DEFAULT_BASE;
        baseInput.value = modeBase;
        baseHint.textContent = sameOrigin
          ? '当前是部署打开：默认读本页所在服务的状态，也可以改成别的地址。'
          : '当前是本机打开：填上解析服务的地址（部署后填服务器地址）。';

        baseInput.addEventListener('change', function () {
          var v = baseInput.value.trim().replace(/\/+$/, '');
          baseInput.value = v;
          if (!sameOrigin) localStorage.setItem(BASE_KEY, v);
          refreshAll();
        });
        document.getElementById('recheck').addEventListener('click', refreshAll);

        var autoOn = localStorage.getItem(AUTO_KEY) !== 'off';
        autoBox.checked = autoOn;
        autoBox.addEventListener('change', function () {
          localStorage.setItem(AUTO_KEY, autoBox.checked ? 'on' : 'off');
          schedule();
        });

        var countdown = REFRESH_MS / 1000;
        var tickTimer = null;

        function schedule() {
          if (tickTimer) {
            clearInterval(tickTimer);
            tickTimer = null;
          }
          if (autoBox.checked) {
            countdown = REFRESH_MS / 1000;
            tickTimer = setInterval(function () {
              countdown -= 1;
              if (countdown <= 0) {
                countdown = REFRESH_MS / 1000;
                refreshAll();
              }
              updateCheckedLine(null);
            }, 1000);
          }
        }

        // 标签页切到后台时暂停刷新，回来立刻查一次
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) {
            if (tickTimer) {
              clearInterval(tickTimer);
              tickTimer = null;
            }
          } else {
            refreshAll();
            schedule();
          }
        });

        function nowTime() {
          return new Date().toLocaleTimeString('zh-CN', { hour12: false });
        }

        function updateCheckedLine(lastOkAt) {
          var t = lastOkAt || lastCheckAt;
          bannerChecked.textContent = t
            ? '上次检查 ' + t + (autoBox.checked ? ' · ' + countdown + ' 秒后再查' : ' · 自动刷新已关')
            : '尚未检查';
        }

        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }

        function fmtUptime(sec) {
          sec = Math.floor(sec);
          if (sec < 60) return '刚启动 ' + sec + ' 秒';
          var m = Math.floor(sec / 60);
          if (m < 60) return m + ' 分钟';
          var h = Math.floor(m / 60);
          m = m % 60;
          if (h < 24) return h + ' 小时 ' + m + ' 分钟';
          var d = Math.floor(h / 24);
          h = h % 24;
          return d + ' 天 ' + h + ' 小时';
        }

        function fmtNum(n) {
          return n.toLocaleString('zh-CN');
        }

        // ===== 拉取各端点 =====
        function fetchJson(base, path, timeoutMs) {
          var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
          var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeoutMs || 8000) : null;
          return fetch(base + path, { signal: ctrl ? ctrl.signal : undefined })
            .then(function (res) {
              return res.json().then(
                function (body) {
                  return { status: res.status, body: body };
                },
                function () {
                  return { status: res.status, body: null };
                },
              );
            })
            .finally(function () {
              if (timer) clearTimeout(timer);
            });
        }

        function fetchText(base, path, timeoutMs) {
          var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
          var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeoutMs || 8000) : null;
          return fetch(base + path, { signal: ctrl ? ctrl.signal : undefined })
            .then(function (res) {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.text();
            })
            .finally(function () {
              if (timer) clearTimeout(timer);
            });
        }

        // ===== /metrics 文本 → 页面用的几个数 =====
        function parseMetrics(text) {
          var out = {
            ok: 0,
            fail: 0,
            cacheHits: null,
            upstream: 0,
            downgrades: null,
            retries: null,
            avgMs: null,
            events: [],
          };
          var series = {}; // name -> { labels: {}, value }
          String(text).split('\n').forEach(function (line) {
            if (!line || line.charAt(0) === '#') return;
            var m = line.match(/^([a-zA-Z_][a-zA-Z0-9_]*)($|\{)/);
            if (!m) return;
            var name = m[1];
            var rest = line.slice(name.length);
            var labels = {};
            if (rest.charAt(0) === '{') {
              var close = rest.indexOf('}');
              if (close < 0) return;
              var labelPart = rest.slice(1, close);
              var re = /([a-zA-Z_][a-zA-Z0-9_]*)="((?:[^"\\]|\\.)*)"/g;
              var lm;
              while ((lm = re.exec(labelPart))) labels[lm[1]] = lm[2];
              rest = rest.slice(close + 1);
            }
            var value = Number(rest.trim());
            if (!isFinite(value)) return;
            series[name] = { labels: labels, value: value };
          });
          for (var key in series) {
            var s = series[key];
            if (key === 'parse_total') {
              if (s.labels.code === 'ok') out.ok += s.value;
              else out.fail += s.value;
            } else if (key === 'cache_hit_total') {
              out.cacheHits = (out.cacheHits || 0) + s.value;
            } else if (key === 'channel_downgrade_total') {
              out.downgrades = (out.downgrades || 0) + s.value;
            } else if (key === 'parse_retry_total') {
              out.retries = (out.retries || 0) + s.value;
            } else if (key === 'upstream_error_total' && s.value > 0) {
              out.upstream += s.value;
              out.events.push({ platform: s.labels.platform || '未知来源', reason: s.labels.reason || 'UNKNOWN', count: s.value });
            }
          }
          var sum = 0;
          var count = 0;
          for (var k2 in series) {
            if (k2.indexOf('parse_duration_ms_sum') === 0) sum += series[k2].value;
            if (k2.indexOf('parse_duration_ms_count') === 0) count += series[k2].value;
          }
          if (count > 0) out.avgMs = Math.round(sum / count);
          out.events.sort(function (a, b) {
            return b.count - a.count;
          });
          return out;
        }

        var REASONS = {
          UPSTREAM_ERROR: '平台出错',
          UPSTREAM_CHANGED: '平台页面改版',
          UPSTREAM_TIMEOUT: '平台响应太慢',
          RISK_CONTROL: '平台风控拦截',
        };
        var PLATFORM_NAMES = { douyin: '抖音', kuaishou: '快手', bilibili: 'B 站', xhs: '小红书', weibo: '微博' };
        var KIND_NAMES = { video: '视频', album: '图集', images: '图集', unknown: '其他' };
        function pName(p) {
          return PLATFORM_NAMES[p] || p;
        }

        // ===== 状态渲染 =====
        var lastCheckAt = null;

        function setBanner(level, headline, subline) {
          banner.className = 'banner ' + level;
          bannerHeadline.textContent = headline;
          bannerSubline.textContent = subline || '';
        }

        function nextSteps(mode) {
          if (mode === 'same-origin') {
            return '服务可能停了。到服务器上运行 <code class="cmd">docker compose ps</code> 看容器在不在，<code class="cmd">docker compose logs --tail=50</code> 看最近日志。';
          }
          return '先确认上面的服务地址填对了；再确认服务确实在运行——本机用 <code class="cmd">bun start</code> 启动，服务器用 <code class="cmd">docker compose ps</code> 查看容器状态。';
        }

        function renderSvc(d) {
          if (!d) {
            svcBody.innerHTML = '<p class="hint">没有可显示的数据。</p>';
            return;
          }
          var ready = d.ready;
          var html = '';
          html += '<div class="kv">';
          html += '<span class="k">运行时长 <b>' + esc(fmtUptime(d.uptime)) + '</b></span>';
          html += '<span class="k">支持平台 <b>' + esc(String(d.platformCount)) + ' 个</b></span>';
          html += '<span class="k">运行标志 <b>' + (d.healthOk ? '正常' : '异常') + '</b></span>';
          html += '</div>';
          if (ready && ready.status !== 'ready') {
            html +=
              '<div class="section-err">服务已启动，但平台还没准备齐（当前 ' +
              esc(String(ready.platforms)) +
              ' 个）。通常重启服务即可恢复。</div>';
          }
          var list = d.platforms || [];
          if (list.length) {
            html += '<div class="platforms">';
            list.forEach(function (p) {
              var caps = p.capabilities || {};
              var kinds = (caps.kinds || []).map(function (k) {
                return KIND_NAMES[k] || k;
              });
              var ways = [];
              if (caps.http) ways.push('直连');
              if (caps.browser) ways.push('浏览器');
              if (caps.tlsImpersonation) ways.push('伪装');
              html += '<div class="platform ready">';
              html += '<div class="name"><span class="pdot"></span>' + esc(pName(p.platform)) + '</div>';
              html += '<div class="pdesc">' + esc(p.description || '') + '</div>';
              html += '<div class="pbadges">';
              kinds.forEach(function (k) {
                html += '<span class="badge ok">' + esc(k) + '</span>';
              });
              ways.forEach(function (w) {
                html += '<span class="badge">' + esc(w) + '</span>';
              });
              html += '</div></div>';
            });
            html += '</div>';
          } else {
            html += '<p class="hint">暂时拿不到平台列表。</p>';
          }
          svcBody.innerHTML = html;
        }

        function renderUsage(d) {
          if (!d) {
            usageBody.innerHTML = '<p class="hint">没有可显示的数据。</p>';
            return;
          }
          var m = d.metrics;
          var html = '';
          html += '<div class="cards">';
          html += card(String(fmtNum(m.ok)), '解析成功');
          html += card(String(fmtNum(m.fail)), '解析失败', m.fail > 0);
          html += card(m.cacheHits == null ? '—' : String(fmtNum(m.cacheHits)), '缓存命中');
          html += card(String(fmtNum(m.upstream)), '平台问题', m.upstream > 0);
          html += '</div>';
          if (m.downgrades != null || m.retries != null) {
            html += '<div class="cards" style="margin-top:10px">';
            html += card(m.downgrades == null ? '—' : String(fmtNum(m.downgrades)), '通道自动降级');
            html += card(m.retries == null ? '—' : String(fmtNum(m.retries)), '瞬时错误重试');
            html += '</div>';
          }
          if (m.avgMs != null) {
            html += '<p class="hint" style="margin:10px 0 0">平均每次解析约 ' + esc(String(m.avgMs)) + ' 毫秒。</p>';
          }
          html += '<h2 style="margin:16px 0 8px;font-size:0.95rem">最近遇到的问题</h2>';
          if (!m.events.length) {
            html += '<p class="hint">近期没有记录到平台侧故障。</p>';
          } else {
            html += '<ul class="events">';
            m.events.forEach(function (ev) {
              html +=
                '<li><span class="badge err">' +
                esc(pName(ev.platform)) +
                '</span><span>' +
                esc(REASONS[ev.reason] || ev.reason) +
                '</span><span class="cnt">' +
                esc(fmtNum(ev.count)) +
                ' 次</span></li>';
            });
            html += '</ul>';
          }
          usageBody.innerHTML = html;

          function card(num, lbl, alert) {
            return (
              '<div class="stat' +
              (alert ? ' alert' : '') +
              '"><div class="num">' +
              num +
              '</div><div class="lbl">' +
              esc(lbl) +
              '</div></div>'
            );
          }
        }

        function refreshAll() {
          var base = (baseInput.value.trim() || DEFAULT_BASE).replace(/\/+$/, '');
          if (!sameOrigin) localStorage.setItem(BASE_KEY, base);

          var healthP = fetchJson(base, '/health').catch(function () {
            return null;
          });
          var readyP = fetchJson(base, '/ready').catch(function () {
            return null;
          });
          var platformsP = fetchJson(base, '/platforms').catch(function () {
            return null;
          });
          var metricsP = fetchText(base, '/metrics').catch(function () {
            return null;
          });

          Promise.all([healthP, readyP, platformsP, metricsP]).then(function (rs) {
            lastCheckAt = nowTime();
            var health = rs[0];
            var ready = rs[1];
            var platforms = rs[2];
            var metricsText = rs[3];

            var alive = !!(health && health.status === 200 && health.body && health.body.status === 'ok');
            var readyOk = !!(ready && ready.status === 200 && ready.body && ready.body.status === 'ready');

            if (!alive) {
              // 服务连不上：横幅给红 + 下一步动作；旧数据保留但标注
              setBanner('err', '暂时连不上服务', '页面会按设置继续自动重试；也可以点「重新检查」马上再试。');
              svcBody.innerHTML =
                '<div class="section-err">拿不到服务状态。' + nextSteps(sameOrigin ? 'same-origin' : 'manual') + '</div>';
              usageBody.innerHTML =
                '<div class="section-err">拿不到使用数据。服务恢复后这里会自动更新。</div>';
              updateCheckedLine(null);
              return;
            }

            var data = {
              uptime: typeof health.body.uptime === 'number' ? health.body.uptime : 0,
              platformCount: ready && ready.body ? ready.body.platforms || 0 : 0,
              ready: ready && ready.body ? ready.body : null,
              healthOk: true,
              platforms: platforms && platforms.body && platforms.body.success ? platforms.body.data : [],
              metrics: parseMetrics(metricsText || ''),
            };

            if (!readyOk) {
              setBanner(
                'warn',
                '服务已启动，但还没准备好',
                '平台还没加载齐，稍等几秒会自动再查；一直不恢复就重启一下服务。',
              );
            } else if (data.metrics.upstream > 0 || data.metrics.fail > 0) {
              setBanner(
                'ok',
                '服务运行正常',
                '部分解析可能因平台侧原因失败过，详情见下方「最近遇到的问题」。',
              );
            } else {
              setBanner('ok', '服务运行正常', '所有平台就绪，可以正常解析。');
            }

            renderSvc(data);
            renderUsage(data);
            updateCheckedLine(lastCheckAt);
          });
        }

        schedule();
        refreshAll();

        // ===== 解析演示（沿用原页能力） =====
        function extractUrl(text) {
          var m = String(text).match(/https?:\/\/[^\s，,、"'）)]+/);
          return m ? m[0] : String(text).trim();
        }

        var HINTS = {
          INVALID_URL: ['链接不完整或不是视频分享链接', '检查是否复制了完整分享口令（含 https:// 链接），或换一条链接'],
          UNSUPPORTED_PLATFORM: ['暂不支持这个平台', '目前支持 抖音 / 快手 / B 站 / 小红书 的分享链接'],
          UNSUPPORTED_CONTENT: ['地址不对或内容类型不支持', '检查服务地址是否填对（默认 http://127.0.0.1:7777）'],
          CONTENT_NOT_FOUND: ['作品不存在或已删除', '在平台 App 里确认作品还在，再复制一条新链接'],
          CONTENT_RESTRICTED: ['作品不可见（私密 / 仅自己可见 / 地区限制）', '换一条公开作品的链接'],
          AUTH_REQUIRED: ['需要登录才能访问', '换一条公开作品的链接'],
          RISK_CONTROL: ['触发了平台风控', '稍等几分钟再试，别短时间高频解析'],
          UPSTREAM_TIMEOUT: ['平台响应超时', '稍后重试'],
          UPSTREAM_CHANGED: ['平台返回的数据格式变了', '稍后重试；持续失败请提 issue'],
          UPSTREAM_ERROR: ['平台暂时出错', '稍后重试'],
          RATE_LIMITED: ['请求太频繁（服务限流 30 次/分钟/IP）', '等一分钟再试'],
          MEDIA_PROXY_DISABLED: ['媒体中转未开启', '直链可直接下载，无需中转；确需中转请在服务端开启'],
          MEDIA_BAD_SIGNATURE: ['媒体中转签名不对', '直链可直接下载；如需中转请重新生成链接'],
          MEDIA_LINK_EXPIRED: ['媒体中转链接过期', '重新解析一次拿新链接'],
          INTERNAL: ['服务内部错误', '稍后重试；持续失败请看服务日志'],
          NETWORK: ['连不上解析服务', '确认服务已启动、服务地址填对了、没被防火墙拦'],
        };

        function renderError(code, message, detail) {
          var hint = HINTS[code] || ['解析失败', '稍后重试；持续失败请提 issue'];
          var detailHtml = '';
          if (detail && Object.keys(detail).length) {
            detailHtml =
              '<div class="code">' +
              esc(
                Object.keys(detail)
                  .map(function (k) {
                    return k + '=' + detail[k];
                  })
                  .join('  '),
              ) +
              '</div>';
          }
          resultDiv.innerHTML =
            '<div class="notice">' +
            '<div><strong>' +
            esc(hint[0]) +
            '</strong> <span class="code">' +
            esc(code) +
            '</span></div>' +
            '<div class="next">下一步：' +
            esc(hint[1]) +
            '</div>' +
            (message ? '<div class="code" style="margin-top:6px">' + esc(message) + '</div>' : '') +
            detailHtml +
            '</div>';
        }

        function linkItem(label, url) {
          return (
            '<li><span class="kind">' +
            esc(label) +
            '</span><a href="' +
            esc(url) +
            '" target="_blank" rel="noreferrer">' +
            esc(url) +
            '</a><button class="secondary" data-copy="' +
            esc(url) +
            '">复制</button></li>'
          );
        }

        function renderResult(body) {
          var d = body.data;
          if (!d) {
            renderError('INTERNAL', '服务返回了空数据');
            return;
          }
          var kindText = KIND_NAMES[d.kind] || d.kind;
          var html = '';
          html += '<div class="meta">';
          html += '<span class="badge ok">' + esc(pName(d.platform)) + '</span>';
          html += '<span class="badge">' + esc(kindText) + '</span>';
          html += '<span class="badge">id ' + esc(d.id) + '</span>';
          if (body.cached) html += '<span class="badge ok">缓存命中</span>';
          html += '</div>';
          html += '<div class="title">' + esc(d.title || '（无标题）') + '</div>';
          if (d.description && d.description !== d.title) {
            html += '<p class="desc">' + esc(d.description) + '</p>';
          }
          if (d.author && d.author.name) {
            html += '<p class="desc">作者：' + esc(d.author.name) + '</p>';
          }

          var assets = d.assets || [];
          var images = assets.filter(function (a) {
            return a.type === 'image';
          });
          var videos = assets.filter(function (a) {
            return a.type !== 'image';
          });

          var cover = '';
          for (var i = 0; i < assets.length; i++) {
            if (assets[i].coverUrl) {
              cover = assets[i].coverUrl;
              break;
            }
          }
          if (cover && images.length === 0) {
            html += '<img class="cover" src="' + esc(cover) + '" alt="封面" />';
          }

          if (images.length > 0) {
            html += '<div class="grid">';
            images.slice(0, 9).forEach(function (a) {
              html +=
                '<a href="' +
                esc(a.url) +
                '" target="_blank" rel="noreferrer"><img src="' +
                esc(a.url) +
                '" alt="图片" loading="lazy" /></a>';
            });
            html += '</div>';
          }

          html += '<ul class="links">';
          videos.forEach(function (a) {
            html += linkItem('视频直链', a.url);
            if (a.audioUrl) html += linkItem('音频直链', a.audioUrl);
            (a.variants || []).forEach(function (v) {
              html += linkItem('档位 ' + v.ratio + (v.watermark ? '（带水印）' : ''), v.url);
            });
          });
          images.forEach(function (a, idx) {
            html += linkItem('图片 ' + (idx + 1), a.url);
          });
          html += '</ul>';
          if (assets.length === 0) html += '<p class="hint">该结果没有可下载资源。</p>';
          resultDiv.innerHTML = html;
        }

        document.getElementById('go').addEventListener('click', doParse);
        shareInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') doParse();
        });

        function doParse() {
          var raw = shareInput.value.trim();
          if (!raw) {
            renderError('INVALID_URL', '先粘一条分享链接');
            return;
          }
          var url = extractUrl(raw);
          var base = (baseInput.value.trim() || DEFAULT_BASE).replace(/\/+$/, '');
          resultDiv.innerHTML = '<p class="hint">解析中……</p>';
          fetch(base + '/parse', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ url: url }),
          })
            .then(function (res) {
              return res
                .json()
                .catch(function () {
                  return null;
                })
                .then(function (body) {
                  return { status: res.status, body: body };
                });
            })
            .then(function (r) {
              if (r.body && r.body.success) {
                renderResult(r.body);
              } else if (r.body && r.body.error) {
                renderError(r.body.error.code, r.body.error.message, r.body.error.detail);
              } else {
                renderError('INTERNAL', '服务返回了无法识别的内容（HTTP ' + r.status + '）');
              }
            })
            .catch(function () {
              renderError('NETWORK', '');
            });
        }

        resultDiv.addEventListener('click', function (e) {
          var btn = e.target.closest('button[data-copy]');
          if (!btn) return;
          var text = btn.getAttribute('data-copy');
          function done() {
            btn.textContent = '已复制';
            setTimeout(function () {
              btn.textContent = '复制';
            }, 1500);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () {
              window.prompt('手动复制：', text);
            });
          } else {
            window.prompt('手动复制：', text);
          }
        });

        // ===== 构建检查（CI）：API 拿不到就降级为只显示徽章 + 链接 =====
        fetch('https://api.github.com/repos/hey-yx/short-video-extractor/actions/runs?per_page=1')
          .then(function (res) {
            return res.json();
          })
          .then(function (data) {
            var run = data && data.workflow_runs && data.workflow_runs[0];
            if (!run) throw new Error('no run');
            var verdict = run.conclusion || run.status;
            ciText.innerHTML =
              '最近一次：<strong>' +
              esc(verdict) +
              '</strong> · ' +
              esc(run.head_branch) +
              ' · ' +
              esc(run.display_title) +
              ' · ' +
              esc(run.created_at) +
              ' · <a href="' +
              esc(run.html_url) +
              '" target="_blank" rel="noreferrer">查看运行</a>';
          })
          .catch(function () {
            ciText.innerHTML =
              '跨域或网络受限，读不到检查记录（徽章仍有效）· <a href="https://github.com/hey-yx/short-video-extractor/actions/workflows/test.yml" target="_blank" rel="noreferrer">查看全部记录</a>';
          });
      })();
    </script>
  </body>
</html>
